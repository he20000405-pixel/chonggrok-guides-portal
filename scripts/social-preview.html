<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #f3f7f5;
      color: #14211e;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }
    main {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: 1.1fr 0.9fr;
      background: #ffffff;
    }
    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 54px 64px 70px;
      border-left: 14px solid #075845;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #075845;
      font-size: 22px;
      font-weight: 800;
    }
    .mark {
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      border-radius: 8px;
      background: #075845;
      color: #ffffff;
      font-size: 17px;
    }
    h1 {
      margin: 34px 0 20px;
      font-size: 58px;
      line-height: 1.18;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #5d6d68;
      font-size: 25px;
      line-height: 1.55;
    }
    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 62px 62px 62px 26px;
      background: #e8f1ed;
    }
    .tile {
      position: relative;
      display: flex;
      min-height: 230px;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: 24px;
      border: 1px solid #bdcbc6;
      border-radius: 8px;
      background: #ffffff;
    }
    .tile::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 7px;
      background: var(--color);
      content: "";
    }
    .tile strong { font-size: 25px; }
    .tile span {
      margin-top: 8px;
      color: #5d6d68;
      font-size: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <div class="brand"><span class="mark">CG</span> CHONGGROK</div>
      <h1>国内支付<br>升级 AI 会员</h1>
      <p>ChatGPT · Grok · Claude · Gemini<br>会员服务与知识指南</p>
    </section>
    <section class="products">
      <div class="tile" style="--color:#0a7f67"><strong>ChatGPT</strong><span>Plus · Pro 会员</span></div>
      <div class="tile" style="--color:#202927"><strong>Grok</strong><span>SuperGrok 会员</span></div>
      <div class="tile" style="--color:#a24f37"><strong>Claude</strong><span>Pro · Max 会员</span></div>
      <div class="tile" style="--color:#1f6d7a"><strong>Gemini</strong><span>Google AI 会员</span></div>
    </section>
  </main>
</body>
</html>
