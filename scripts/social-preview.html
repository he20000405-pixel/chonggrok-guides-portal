<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #f7f4ed;
      color: #13211d;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }
    main {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: 1.05fr 0.95fr;
      background: #fbfaf6;
    }
    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 62px 50px 62px 68px;
      border-left: 14px solid #075541;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #075541;
      font-size: 22px;
      font-weight: 800;
    }
    .mark {
      display: grid;
      width: 50px;
      height: 50px;
      place-items: center;
      border-radius: 8px;
      background: #075541;
      color: #ffffff;
      font-size: 17px;
    }
    h1 {
      margin: 30px 0 18px;
      font-size: 53px;
      line-height: 1.13;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #68756f;
      font-size: 23px;
      line-height: 1.55;
    }
    .products {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 62px 58px 62px 24px;
      background: #edf4ef;
    }
    .tile {
      position: relative;
      display: flex;
      min-height: 230px;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: 24px;
      border: 1px solid #d6ded9;
      border-radius: 8px;
      background: #ffffff;
    }
    .tile::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 7px;
      background: var(--color);
      content: "";
    }
    .tile strong { font-size: 25px; }
    .tile span {
      margin-top: 8px;
      color: #5d6d68;
      font-size: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <div class="brand"><span class="mark">CG</span> CHONGGROK</div>
      <h1>ChatGPT、Grok、Claude、Gemini<br>AI 会员充值</h1>
      <p>国内支付，升级你自己的账号<br>会员服务与知识指南</p>
    </section>
    <section class="products">
      <div class="tile" style="--color:#0b8c70"><strong>ChatGPT</strong><span>Plus · Pro 会员</span></div>
      <div class="tile" style="--color:#25312e"><strong>Grok</strong><span>SuperGrok 会员</span></div>
      <div class="tile" style="--color:#a95039"><strong>Claude</strong><span>Pro · Max 会员</span></div>
      <div class="tile" style="--color:#247889"><strong>Gemini</strong><span>Google AI 会员</span></div>
    </section>
  </main>
</body>
</html>
